<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="AnteriorityUI">
  <!-- Fondo oscuro: hace que el cian de React, el violeta y el blanco del logo contrasten bien sobre cualquier superficie -->
  <circle cx="280" cy="280" r="276" fill="#0B1020"/>
  <circle cx="280" cy="280" r="276" fill="none" stroke="#61DAFB" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Logo de React (átomo) detrás: atenuado y desenfocado para que la A resalte -->
  <g fill="none" stroke="#61DAFB" stroke-width="14" stroke-linecap="round" opacity="0.4" filter="url(#atom-blur)">
    <ellipse cx="280" cy="280" rx="240" ry="92"/>
    <ellipse cx="280" cy="280" rx="240" ry="92" transform="rotate(60 280 280)"/>
    <ellipse cx="280" cy="280" rx="240" ry="92" transform="rotate(120 280 280)"/>
  </g>
  <circle cx="280" cy="280" r="30" fill="#61DAFB" opacity="0.4" filter="url(#atom-blur)"/>

  <!-- Difuminado: sombra suave (silueta de la A desenfocada) entre el átomo y la A, para que el átomo se funda detrás -->
  <defs>
    <filter id="atom-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="a-soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26" result="blur"/>
      <feFlood flood-color="#0B1020" flood-opacity="0.95"/>
      <feComposite in2="blur" operator="in"/>
    </filter>
  </defs>
  <use href="#anteriority-a" filter="url(#a-soft-shadow)"/>

  <!-- Logo de AnteriorityUI delante, centrado y escalado -->
  <g id="anteriority-a" transform="translate(280 280) scale(0.8) translate(-223 -185)">
